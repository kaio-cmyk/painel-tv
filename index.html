<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Conta Junto — Dashboard TV (v27)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root{
      /* 1u ≈ 1% da largura numa tela 16:9 (19px em Full HD, 38px em 4K): tudo escala junto */
      --u: min(1vw, 1.778vh);
      --f: calc(var(--u)*.88); /* unidade das letras: 12% menor que a das medidas */
      --stroke:rgba(15,23,42,.08);
      --text:#0f172a;
      --muted:#64748b;
      --blue:#2563eb;
      --green:#16a34a;
      --red:#dc2626;
      --amber:#d97706;
      --teal:#0d9488;
      --shadow: 0 2px 6px -1px rgba(15,23,42,.10);
      --card-bg:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,sans-serif;
      background:#eef2f7; color:var(--text);
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      font-variant-numeric: tabular-nums;
    }

    .wrap{
      height:100%; padding:calc(var(--u)*.8);
      display:grid;
      grid-template-rows:calc(var(--u)*3.8) 1fr calc(var(--u)*1.2);
      gap:calc(var(--u)*.7);
    }

    header{
      display:flex; align-items:center; justify-content:space-between;
      padding:0 calc(var(--u)*1.2);
      background:var(--card-bg);
      border:1px solid var(--stroke); border-radius:calc(var(--u)*.8); box-shadow:var(--shadow);
    }
    .brand{display:flex; gap:calc(var(--u)*.7); align-items:center;}
    .logo{
      width:calc(var(--u)*2.3); height:calc(var(--u)*2.3); border-radius:calc(var(--u)*.5);
      background:linear-gradient(135deg, var(--blue), #3b82f6);
    }
    .brand h1{margin:0; font-size:calc(var(--f)*1.5); line-height:1.1; letter-spacing:-.01em; color:#1e293b;}
    .brand .sub{font-size:calc(var(--f)*.85); color:var(--muted); font-weight:600;}

    .rightHeader{display:flex; align-items:center; gap:calc(var(--u)*.6);}
    .pill{
      display:flex; align-items:center; gap:calc(var(--u)*.45);
      padding:calc(var(--u)*.35) calc(var(--u)*.8); border-radius:calc(var(--u)*.4);
      background:#f1f5f9; border:1px solid var(--stroke);
      font-weight:700; font-size:calc(var(--f)*1.05); color:#334155;
    }
    .dot{width:calc(var(--u)*.55); height:calc(var(--u)*.55); border-radius:50%;}
    .dot.ok{background:var(--green); box-shadow:0 0 0 3px rgba(22,163,74,.18);}
    .dot.bad{background:var(--red); box-shadow:0 0 0 3px rgba(220,38,38,.18);}
    .dot.warn{background:var(--amber); box-shadow:0 0 0 3px rgba(217,119,6,.18);}

    main{min-height:0;}
    .deptGrid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      grid-template-rows:repeat(2, 1fr);
      gap:calc(var(--u)*.8);
      height:100%; min-height:0;
    }

    .deptCard{
      background:var(--card-bg);
      border:2px solid var(--stroke);
      border-radius:calc(var(--u)*.9);
      box-shadow:var(--shadow);
      padding:calc(var(--u)*.9) calc(var(--u)*1.1) calc(var(--u)*.7);
      display:flex; flex-direction:column;
      position:relative; overflow:hidden; min-height:0;
    }

    @keyframes bgPulse {
      0%,100% { background-color:#fff; border-color:rgba(220,38,38,.35); }
      50% { background-color:#fef2f2; border-color:rgba(220,38,38,1); }
    }
    @keyframes textFlash { 0%,100%{opacity:1} 50%{opacity:.65} }

    .deptCard.alert{ animation:bgPulse 2.4s infinite ease-in-out; }
    .deptCard.alert .deptTitle{ color:var(--red); }
    /* Prazo técnico vencido, ainda antes da data de atraso: aviso sem piscar */
    .deptCard.warn:not(.alert){ border-color:rgba(217,119,6,.6); }

    .badge{
      position:absolute; top:calc(var(--u)*.8); right:calc(var(--u)*.9);
      color:#fff; font-size:calc(var(--f)*.85); font-weight:800;
      text-transform:uppercase; letter-spacing:.04em;
      padding:calc(var(--u)*.25) calc(var(--u)*.6); border-radius:calc(var(--u)*.3);
      display:none; z-index:10;
    }
    .alertBadge{ background:var(--red); animation:textFlash 1.5s infinite; }
    .warnBadge{ background:var(--amber); }
    .deptCard.alert .alertBadge{ display:block; }
    .deptCard.warn:not(.alert) .warnBadge{ display:block; }

    .deptTitle{
      font-size:calc(var(--f)*1.5); font-weight:800; line-height:1.15;
      text-transform:uppercase; letter-spacing:.01em; color:#334155;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      padding-right:calc(var(--u)*9);
    }

    .chartWrap{
      flex:1; position:relative; width:100%; min-height:0;
      margin:calc(var(--u)*.3) 0;
      container-type:size; /* o texto do centro acompanha o tamanho do círculo */
    }
    .chartWrap canvas{position:absolute; inset:0;}

    .chartOverlay{
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;
    }
    .chartPct{
      font-size:calc(var(--f)*3); font-size:min(calc(var(--f)*3.6), 15cqmin); font-weight:900; color:var(--text);
      letter-spacing:-.04em; line-height:1;
    }
    .chartLabel{font-size:calc(var(--f)*.85); font-size:min(calc(var(--f)*.85), 3.7cqmin); font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:calc(var(--u)*.25);}
    .chartToday{
      font-size:calc(var(--f)*1.05); font-size:min(calc(var(--f)*1.05), 4.75cqmin); font-weight:800; color:var(--teal);
      margin-top:calc(var(--u)*.35); visibility:hidden;
    }
    .chartToday.show{visibility:visible;}

    .deptFooter{
      display:flex; justify-content:space-between;
      gap:calc(var(--u)*.6); padding:calc(var(--u)*.6) calc(var(--u)*.2) 0;
      border-top:2px solid #f1f5f9;
    }
    .statItem{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0;}
    .statVal{font-size:calc(var(--f)*2.1); font-weight:900; line-height:1; letter-spacing:-.02em;}
    .statVal.zero{opacity:.3;}
    .statLabel{
      font-size:calc(var(--f)*.8); font-weight:700; color:#64748b;
      margin-top:calc(var(--u)*.3); white-space:nowrap;
    }
    .statLabel::before{
      content:""; display:inline-block; width:calc(var(--u)*.5); height:calc(var(--u)*.5);
      border-radius:50%; background:var(--dot); margin-right:calc(var(--u)*.25); vertical-align:.05em;
    }

    .c-green{color:var(--green)} .c-blue{color:var(--blue)} .c-red{color:var(--red)}
    .c-teal{color:var(--teal)} .c-amber{color:var(--amber)}

    footer{
      display:flex; justify-content:space-between; align-items:center;
      padding:0 calc(var(--u)*.5); color:#64748b; font-size:calc(var(--f)*.75); font-weight:600;
    }

    .diag{
      position:absolute; left:calc(var(--u)*1); right:calc(var(--u)*1); bottom:calc(var(--u)*3); display:none;
      padding:calc(var(--u)*.8); border-radius:calc(var(--u)*.6); border:1px solid #fca5a5;
      background:#fef2f2; color:#991b1b; box-shadow:var(--shadow); z-index:999;
      font-size:calc(var(--f)*.9);
    }
    .diag.show{display:block}
    .diag h3{margin:0 0 calc(var(--u)*.3);}
    .diag p{margin:0;}
    .diag code{display:block; margin-top:calc(var(--u)*.4); font-family:monospace; background:rgba(0,0,0,.05); padding:calc(var(--u)*.4); border-radius:4px;}

    /* Telas em pé (celular, monitor vertical): cards em coluna com altura fixa */
    @media (max-aspect-ratio: 1/1){
      :root{ --u: 2.2vw; --f: calc(var(--u)*.88); }
      body{overflow:auto;}
      .wrap{height:auto; grid-template-rows:auto auto auto;}
      header{padding:calc(var(--u)*.8) calc(var(--u)*1.2);}
      .deptGrid{grid-template-columns:1fr; grid-template-rows:none; grid-auto-rows:calc(var(--u)*30);}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Conta Junto · Painel Operacional</h1>
          <div class="sub" id="subtitulo">Status das entregas por departamento</div>
        </div>
      </div>
      <div class="rightHeader">
        <div class="pill">🕒 <span id="clock">--:--:--</span></div>
        <div class="pill"><span class="dot" id="loadDot"></span><span id="loadLabel">Carregando...</span></div>
      </div>
    </header>

    <main>
      <div class="deptGrid" id="deptGrid"></div>
    </main>

    <footer>
      <div>Fonte: Acessórias • <span id="sourceInfo">—</span></div>
      <div>Atualizado em <span id="updatedAt">—</span></div>
    </footer>
  </div>

  <div class="diag" id="diag">
    <h3>⚠️ Falha de Conexão</h3>
    <p id="diagMsg">—</p>
    <code id="diagUrl">—</code>
  </div>

<script>
/* =============================================
   CONFIGURAÇÕES
============================================= */
// dados.json é gerado do Acessórias pelo sincronizar.py (GitHub Actions, a cada 10 min).
const DADOS_URL = "dados.json";
const REFRESH_MS = 60 * 1000;
// Sem atualização há mais que isso, o painel avisa que a rotina do GitHub parou.
const DESATUALIZADO_MS = 45 * 60 * 1000;

/* =============================================
   UTILITÁRIOS
============================================= */
const el = (id) => document.getElementById(id);

function setState(state, label){
  const dot = el("loadDot");
  dot.classList.remove("ok","bad","warn");
  if(state==="ok") dot.classList.add("ok");
  if(state==="bad") dot.classList.add("bad");
  if(state==="warn") dot.classList.add("warn");
  el("loadLabel").textContent = label;
}

function showDiag(show, msg="", url=""){
  const box = el("diag");
  box.classList.toggle("show", !!show);
  if(show){ el("diagMsg").textContent = msg||"—"; el("diagUrl").textContent = url||"—"; }
}

function brDate(d){
  if(!(d instanceof Date)||isNaN(d)) return "—";
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function brTime(d){
  if(!(d instanceof Date)||isNaN(d)) return "—";
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function todayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d; }

function parseDate(x){
  if(x===null||x===undefined) return null;
  if(x instanceof Date&&!isNaN(x)){ const d=new Date(x); d.setHours(0,0,0,0); return d; }
  const s=String(x).trim(); if(!s||s.startsWith("0000")) return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00`);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(`${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}T00:00:00`);
  const d=new Date(s); return isNaN(d)?null:d;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}

/* =============================================
   ACESSÓRIAS (dados.json)
============================================= */
async function loadAcessorias(){
  const url=`${DADOS_URL}?t=${Date.now()}`; // fura o cache do GitHub Pages
  let res;
  try{
    res = await fetch(url,{cache:"no-store"});
  }catch(e){
    throw {kind:"network",msg:"Sem conexão para buscar os dados do painel.",url:DADOS_URL};
  }
  if(!res.ok) throw {kind:"http",msg:`dados.json: HTTP ${res.status}. A rotina do GitHub já rodou?`,url:DADOS_URL};
  return await res.json();
}

/* =============================================
   RENDERIZAÇÃO
============================================= */
// Um card por departamento, reaproveitado a cada minuto (sem redesenhar a tela).
const cards = new Map();
const fmt = (n)=>Number(n||0).toLocaleString("pt-BR");

function buildDeptCard(parent, deptName){
  const card=document.createElement("div"); card.className="deptCard";
  card.innerHTML=`
    <div class="badge alertBadge">⚠️ Atraso</div>
    <div class="badge warnBadge">⏱ Prazo técnico</div>
    <div class="deptTitle"></div>
    <div class="chartWrap">
      <canvas></canvas>
      <div class="chartOverlay">
        <span class="chartPct" data-pct>0%</span>
        <span class="chartLabel">Concluído</span>
        <span class="chartToday" data-hoje></span>
      </div>
    </div>
    <div class="deptFooter">
      <div class="statItem"><span class="statVal c-teal" data-today>0</span><span class="statLabel" style="--dot:${CORES.hoje}">Hoje</span></div>
      <div class="statItem"><span class="statVal c-green" data-done>0</span><span class="statLabel" style="--dot:${CORES.concl}">Concluídas</span></div>
      <div class="statItem"><span class="statVal c-blue" data-ontime>0</span><span class="statLabel" style="--dot:${CORES.prazo}">No prazo</span></div>
      <div class="statItem"><span class="statVal c-amber" data-tec>0</span><span class="statLabel" style="--dot:${CORES.tec}">Pz. técnico</span></div>
      <div class="statItem"><span class="statVal c-red" data-late>0</span><span class="statLabel" style="--dot:${CORES.atraso}">Atraso</span></div>
    </div>`;
  card.querySelector(".deptTitle").textContent=deptName;
  parent.appendChild(card);
  const chart=new Chart(card.querySelector("canvas").getContext("2d"),{
    type:"doughnut",
    data:{datasets:[{data:[],backgroundColor:[CORES.concl, CORES.hoje, CORES.atraso, CORES.tec, CORES.prazo, CORES.semPrazo],borderWidth:0,spacing:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"70%",animation:{duration:600},
             layout:{padding:4},plugins:{legend:{display:false},tooltip:{enabled:false}},events:[]}
  });
  return {card,chart};
}

const CORES={concl:"#16a34a", hoje:"#14b8a6", atraso:"#dc2626", tec:"#f59e0b", prazo:"#3b82f6", semPrazo:"#cbd5e1"};

// Entregas do Acessórias: {d: departamento, p: prazo técnico, a: data em que vira "Atrasada!",
// e: dia da entrega, s: C=concluída | A=aberta | D=dispensada}. Datas AAAA-MM-DD.
function computeTaskMetrics(rows){
  const t0=todayStart();
  const novo=()=>({done:0,doneToday:0,doneBefore:0,open:0,late:0,tec:0,onTime:0,noDue:0});
  const deptMap=new Map();
  // Dispensadas ficam fora da conta, como as "Desconsideradas" do Onvio.
  for(const r of rows){
    if(r.s==="D") continue;
    const key=String(r.d||"").trim()||"Sem departamento";
    if(!deptMap.has(key)) deptMap.set(key,novo());
    const d=deptMap.get(key);
    if(r.s==="C"){
      d.done++;
      const ent=parseDate(r.e);
      if(ent&&ent.getTime()===t0.getTime()) d.doneToday++; else d.doneBefore++;
      continue;
    }
    d.open++;
    const prazo=parseDate(r.p), atraso=parseDate(r.a)||prazo;
    if(!prazo) d.noDue++;
    else if(atraso<t0) d.late++;   // passou da data de atraso: atrasada de verdade
    else if(prazo<t0) d.tec++;     // só o prazo técnico venceu
    else d.onTime++;
  }
  return {deptMap};
}

function renderDepartments(m){
  const grid=el("deptGrid");
  const list=[...m.deptMap.entries()].map(([dept,c])=>({dept,...c}))
    .sort((a,b)=>(b.open-a.open)||(b.late-a.late)).slice(0,6);
  // Só remonta a grade se mudar a lista de departamentos
  if(list.map(x=>x.dept).join("|")!==[...cards.keys()].join("|")){
    for(const c of cards.values()) c.chart.destroy();
    cards.clear(); grid.innerHTML="";
    for(const item of list) cards.set(item.dept, buildDeptCard(grid,item.dept));
  }
  for(const item of list){
    const {card,chart}=cards.get(item.dept);
    card.classList.toggle("alert",item.late>0);
    card.classList.toggle("warn",item.tec>0);
    const valores={today:item.doneToday, done:item.doneBefore, ontime:item.onTime+item.noDue, tec:item.tec, late:item.late};
    for(const [k,v] of Object.entries(valores)){
      const n=card.querySelector(`[data-${k}]`);
      n.textContent=fmt(v); n.classList.toggle("zero",v===0);
    }
    const totalDept=item.done+item.open;
    const pct=totalDept>0?Math.round((item.done/totalDept)*100):0;
    card.querySelector("[data-pct]").textContent=`${pct}%`;
    const hoje=card.querySelector("[data-hoje]");
    hoje.textContent=`+${fmt(item.doneToday)} hoje`;
    hoje.classList.toggle("show",item.doneToday>0);
    chart.data.datasets[0].data=[item.doneBefore, item.doneToday, item.late, item.tec, item.onTime, item.noDue];
    chart.update();
  }
}

function mesLabel(ym){
  const m=String(ym||"").match(/^(\d{4})-(\d{2})/);
  return m?`${m[2]}/${m[1]}`:"—";
}

/* =============================================
   LOOP PRINCIPAL
============================================= */
async function loadAll(){
  setState("warn","Carregando...");
  try{
    const tasks=await loadAcessorias();
    const metrics=computeTaskMetrics(Object.values(tasks.entregas||{}));
    renderDepartments(metrics);
    const sinc=new Date(tasks.atualizado_em);
    el("updatedAt").textContent=`${brDate(sinc)}, ${brTime(sinc)}`;
    el("sourceInfo").textContent=`Entregas com prazo em ${mesLabel(tasks.mes)}`;
    el("subtitulo").textContent=`Status das entregas por departamento · prazo em ${mesLabel(tasks.mes)}`;
    if(Date.now()-sinc.getTime() > DESATUALIZADO_MS) setState("warn","Dados desatualizados");
    else setState("ok","Atualizado");
    showDiag(false);
  }catch(err){
    setState("bad","Erro");
    showDiag(true,err.msg||String(err),err.url||DADOS_URL);
  }
}

/* =============================================
   CLOCK + INIT
============================================= */
function tickClock(){ el("clock").textContent=new Date().toLocaleTimeString("pt-BR"); }
setInterval(tickClock,1000); tickClock();
loadAll();
setInterval(loadAll,REFRESH_MS);
</script>
</body>
</html>
